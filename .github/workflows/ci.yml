name: CI Build & Security Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Unit & Integration Tests
        run: npm test

      - name: Verify Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.greenyhygiene.com
          NEXT_PUBLIC_WHATSAPP_NUMBER: "919000000000"
          NEXT_PUBLIC_PHONE_NUMBER: "+919000000000"
